services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: edulearn-app:latest
    container_name: edulearn_app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      APP_NAME: "EduLearn"
      APP_ENV: "production"
      APP_KEY: "${APP_KEY:-base64:3tA6jKk8xV6e4YlZ3n1Q5p9R7m2O4s8T1u5W9y2A4d8=}"
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost}"
      DB_CONNECTION: "mysql"
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-learn_english_db}"
      DB_USERNAME: "${DB_USERNAME:-edulearn_user}"
      DB_PASSWORD: "${DB_PASSWORD:-SecretPassword123!}"
      CACHE_STORE: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_CONNECTION: "redis"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      RUN_MIGRATIONS: "true"
      SEED_DATABASE: "${SEED_DATABASE:-true}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - edulearn_network

  mysql:
    image: mysql:8.0
    container_name: edulearn_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-learn_english_db}"
      MYSQL_USER: "${DB_USERNAME:-edulearn_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-SecretPassword123!}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-RootSecretPassword123!}"
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edulearn_network

  redis:
    image: redis:7-alpine
    container_name: edulearn_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - edulearn_network

networks:
  edulearn_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
