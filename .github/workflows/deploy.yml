name: EduLearn CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. QUALITY GATE & AUTOMATED TESTING (CI)
  # ==========================================
  test:
    name: 🧪 Automated Testing & Build Gate
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.3 & Extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, pdo_mysql, bcmath, zip, gd, redis
          coverage: none

      - name: 📦 Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: 🟢 Setup Node.js 20 & Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Frontend Dependencies & Compile Assets
        run: |
          npm ci
          npm run build

      - name: 🔑 Setup Testing Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: 🧪 Execute PHPUnit Automated Tests
        run: php artisan test --parallel

  # ==========================================
  # 2. BUILD & PUSH DOCKER IMAGE
  # ==========================================
  build-docker:
    name: 🐳 Build & Push Docker Image
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/app
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 🚀 Build & Push Multi-Stage Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 3. CONTINUOUS DEPLOYMENT TO AWS (CD)
  # ==========================================
  deploy-aws:
    name: ☁️ Deploy to AWS EC2 / Lightsail
    needs: build-docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Execute Remote Deployment Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.AWS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Deploying EduLearn to AWS Server..."
            
            # Navigate to project directory or clone if not exists
            if [ ! -d "/home/ubuntu/learn-english" ]; then
              cd /home/ubuntu
              git clone https://github.com/${{ github.repository }}.git
            fi
            
            cd /home/ubuntu/learn-english
            
            # Pull latest commits
            git pull origin main
            
            # Ensure .env exists from docker example
            if [ ! -f ".env" ]; then
              cp .env.docker.example .env
            fi
            
            # Build and restart containers seamlessly
            docker compose up --build -d
            
            # Optimize production Laravel runtime
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache
            docker compose exec -T app php artisan event:cache
            docker compose exec -T app php artisan migrate --force
            
            echo "🎉 EduLearn Deployment Successful on AWS!"
